name: Build XCFrameworks from main

"on":
  push:
    branches: [main]
    paths:
      - "**/*.podspec"
      - "**/*.podspec.json"
      - "scripts/xcframework/**"
      - "tests/xcframework/**"
      - "config/xcframework-build.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - ".github/workflows/build-xcframeworks.yml"
      - ".github/workflows/sync-xcframeworks.yml"
  workflow_dispatch:
    inputs:
      pods:
        description: "Comma-separated pod names; empty rebuilds all latest source pods"
        type: string
        default: ""
      platforms:
        description: "Build scope: iOS device/simulator by default, or all declared platforms"
        type: choice
        options: [ios, all]
        default: ios

permissions:
  contents: write

concurrency:
  group: xcframework-main-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-xcframeworks.yml
    with:
      revision: ${{ github.sha }}
      base: ${{ github.event_name == 'push' && github.event.before || '' }}
      pods: ${{ inputs.pods || '' }}
      platforms: ${{ inputs.platforms || 'ios' }}
    secrets: inherit
